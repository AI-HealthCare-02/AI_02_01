name: CI

on:
  pull_request:
    branches: [main, develop, dev]

jobs:
  # 1. FastAPI 백엔드 테스트
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/app
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # pytest와 필요한 패키지를 명시적으로 설치
          pip install pytest pytest-asyncio 
          if [ -f "pyproject.toml" ]; then
            pip install . 
          elif [ -f "app/requirements.txt" ]; then
            pip install -r app/requirements.txt
          fi

      - name: Run Tests
        run: |
          # app 폴더를 파이썬 경로에 추가
          export PYTHONPATH=$PYTHONPATH:$(pwd)/app
          if [ -d "app/tests" ]; then 
            pytest app/tests -v
          else 
            echo "No tests found in app/tests"
          fi

  # 2. AI Worker 검증
  ai-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai_worker
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install ML dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          if [ -f "ai_worker/requirements.txt" ]; then
            pip install -r ai_worker/requirements.txt
          else
            # ai_worker 폴더 내에 파일이 없으면 루트의 설정을 따름
            pip install . 
          fi

      - name: AI Logic Check
        run: |
          # ai_worker 폴더를 파이썬 경로에 추가
          export PYTHONPATH=$PYTHONPATH:$(pwd)/ai_worker
          if [ -d "ai_worker/tests" ]; then
            pytest ai_worker/tests -v --ignore=ai_worker/tests/test_train.py
          else
            echo "No AI tests found in ai_worker/tests"
          fi